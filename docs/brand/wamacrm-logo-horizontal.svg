<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="400" viewBox="0 0 1500 400">
  <g transform="translate(20,10) scale(0.95)">
  <defs>
    <linearGradient id="bub" gradientUnits="userSpaceOnUse" x1="60" y1="40" x2="350" y2="360">
      <stop offset="0" stop-color="#25D366"/><stop offset="0.55" stop-color="#00A884"/><stop offset="1" stop-color="#1D5BEA"/>
    </linearGradient>
    <filter id="sh" filterUnits="userSpaceOnUse" x="-40" y="-40" width="480" height="480"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B2F8F" flood-opacity="0.22"/></filter>
  </defs>
  <!-- A WhatsApp chat bubble: the conversation -->
  <path filter="url(#sh)" fill="url(#bub)" d="M200 28 C302 28 380 102 380 196 C380 290 302 364 200 364 C171 364 144 358 120 347 L48 372 L70 304 C42 274 20 238 20 196 C20 102 98 28 200 28 Z"/>
