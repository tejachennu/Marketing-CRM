  </g>
  <text x="440" y="215" font-family="Inter Display, Inter" font-weight="800" font-size="160" letter-spacing="-4" fill="#0E1B3D">WAMA<tspan fill="#1D5BEA">CRM</tspan></text>
  <text x="446" y="300" font-family="Inter" font-weight="600" font-size="44" letter-spacing="3" fill="#00A884">Chats → Customers → Growth</text>
</svg>
